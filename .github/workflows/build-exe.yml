name: Build EXE

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Window screenshots
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path shots | Out-Null
          $p = Start-Process powershell -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-STA','-File',"$PWD\007Deleter.ps1",'-Preview',"$PWD\shots\win" -Wait -PassThru -RedirectStandardError "$PWD\shots\err.txt"
          Get-ChildItem shots | Select-Object Name, Length
          if (Test-Path shots\err.txt) { Get-Content shots\err.txt }
      - uses: actions/upload-artifact@v4
        with:
          name: preview-shots
          path: shots

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sprawdź składnię w Windows PowerShell 5.1
        shell: powershell
        run: |
          $errs = $null; $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\007Deleter.ps1", [ref]$tokens, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { Write-Error "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          Write-Host 'Syntax OK.'

      - name: Zbuduj 007Deleter.exe
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe -RequiredVersion 1.0.13 -Scope CurrentUser -Force
          Invoke-PS2EXE -inputFile .\007Deleter.ps1 -outputFile .\007Deleter.exe -noConsole -STA -iconFile .\assets\007deleter.ico `
            -title '007 Deleter' -product '007 Deleter' -version '1.0.0.0'
          if (-not (Test-Path .\007Deleter.exe)) { throw 'EXE was not created.' }
          Get-Item .\007Deleter.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: 007Deleter-exe
          path: 007Deleter.exe

      - name: Wydanie (tylko dla tagów v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" > /dev/null 2>&1 || gh release create "${{ github.ref_name }}" --title "007 Deleter ${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" 007Deleter.exe --clobber
